         standalone haría falta manejar los safe-area insets de notch/status bar,
         y eso no se puede verificar sin dispositivo. -->

      name="description"
      content="Recomendación de talle y compra coordinada de indumentaria de natación."

    <meta name="theme-color" content="#1B1B1B" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
